    <script>
      // Shim window.fetch with both getter and setter to support sandbox environments
      (function() {
        try {
          var nativeFetch = window.fetch;
          var fetchFn = nativeFetch ? nativeFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchFn;
            },
            set: function(fn) {
              fetchFn = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              var pFetch = desc && desc.get ? desc.get.call(window) : window.fetch;
              var cur = pFetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return cur; },
                set: function(fn) { cur = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
